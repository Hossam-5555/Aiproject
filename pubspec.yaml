name: wep
description: "SignTalk AI — sign language translation."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.11.1
  google_fonts: ^6.2.1
  permission_handler: ^11.4.0
  get: ^4.7.3
  flutter_map: ^8.3.1
  latlong2: ^0.9.1
  flutter_map_location_marker: ^10.2.0
  location: ^9.0.0
  flutter_polyline_points: ^3.1.0
  http: ^1.6.0
  provider: ^6.1.5+1
  hive_generator: ^2.0.1
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  cloud_firestore: ^6.7.1
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/img/